services:
  invoice:
    build: .
    image: invoice-app:latest
    container_name: invoice
    restart: unless-stopped

    # Non-root; matches `chown -R 1000:1000 ./data` on the host.
    user: "1000:1000"

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - DB_PATH=/data/app.db
      - FILES_DIR=/data/files
      # SQLite needs a writable dir for the WAL/SHM sidecars; /tmp is tmpfs.
      - TMP_DIR=/tmp

    volumes:
      - ./data:/data

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
