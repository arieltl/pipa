services:
  invoice:
    # Pin a versioned release by default. Change INVOICE_IMAGE_TAG only as
    # part of the documented upgrade procedure.
    image: ghcr.io/arieltl/invoice:${INVOICE_IMAGE_TAG:-0.3.1}
    container_name: invoice
    restart: unless-stopped

    # Keep generated files owned by the host user on a typical single-user VPS.
    # Run `mkdir -p data && chown -R 1000:1000 data` before first start.
    user: "1000:1000"

    ports:
      # The app has no built-in authentication. Bind to loopback unless an
      # authenticated reverse proxy or trusted LAN policy requires otherwise.
      - "${INVOICE_BIND_ADDRESS:-127.0.0.1}:3000:3000"

    environment:
      NODE_ENV: production
      # Listen inside the container; host exposure is controlled by ports above.
      INVOICE_HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      DB_PATH: /data/app.db
      FILES_DIR: /data/files
      TMP_DIR: /tmp
      GOTENBERG_URL: ${GOTENBERG_URL:-}
      GOTENBERG_TIMEOUT_MS: ${GOTENBERG_TIMEOUT_MS:-15000}

    volumes:
      - ./data:/data

    tmpfs:
      - /tmp:size=64m,mode=1777

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
