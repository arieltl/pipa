name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Serialize publishing so stable channel updates cannot overlap.
concurrency:
  group: pipa-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Preserve the deployment-compatible package name.
  IMAGE_NAME: ${{ github.repository_owner }}/invoice

jobs:
  publish:
    name: Publish validated release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Check version and find successful main validation
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "docs/releases/$version.md"
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --commit "$commit" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI for $commit. Wait for full main validation, then rerun this release workflow."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download exact tested outputs
        uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: release-bundle
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify commit, completeness, and checksums
        env:
          SOURCE_SHA: ${{ steps.validation.outputs.commit }}
        run: python3 scripts/release-bundle.py verify release-bundle "$SOURCE_SHA"
      - name: Load tested image
        run: docker load -i release-bundle/docker-image.tar
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push tested image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAGS"
          while IFS= read -r tag; do
            docker tag pipa-validated:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          # A draft makes uploads retryable without exposing an incomplete release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > /tmp/release-state.json; then
            if [[ $(python3 -c 'import json; print(json.load(open("/tmp/release-state.json"))["isDraft"])') == False ]]; then
              echo "Release already published; nothing to upload."
              exit 0
            fi
          else
            args=("$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
              --draft --verify-tag --generate-notes --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md")
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release-bundle/pipa-*.tar.gz release-bundle/pipa-*.zip \
            release-bundle/SHA256SUMS.txt release-bundle/release-manifest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
