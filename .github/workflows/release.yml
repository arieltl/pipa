name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Keep the existing package when the repository is renamed to Pipa.
  IMAGE_NAME: ${{ github.repository_owner }}/invoice

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime assets
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:unit

      - name: Build executable
        run: bun build --compile --minify --sourcemap --bytecode --target=bun-linux-x64-baseline src/index.tsx --outfile dist/invoice

  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [test, binaries]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Docker metadata-action otherwise infers a `latest` tag from semver
          # input. Stable `latest` is added only by the explicit rule below.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Pre-release tags (for example v0.2.0-beta.1) must never move
            # the stable deployment channel.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: downloads
      - name: Generate checksums and verify complete download set
        working-directory: downloads
        run: |
          expected=(pipa-linux-x64.tar.gz pipa-linux-arm64.tar.gz pipa-windows-x64.zip pipa-macos-x64.tar.gz pipa-macos-arm64.tar.gz)
          for archive in "${expected[@]}"; do test -s "$archive"; done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          args=(
            "${GITHUB_REF_NAME}"
            --repo "${GITHUB_REPOSITORY}"
            --title "${GITHUB_REF_NAME}"
            --generate-notes
            --verify-tag
            --notes "Docker image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" downloads/*
