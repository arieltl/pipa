name: Binary downloads

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binary:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            executable: invoice
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            executable: invoice
          - platform: windows-x64
            runner: windows-2022
            target: bun-windows-x64-baseline
            executable: invoice.exe
          - platform: macos-x64
            runner: macos-15-intel
            target: bun-darwin-x64
            executable: invoice
          - platform: macos-arm64
            runner: macos-15
            target: bun-darwin-arm64
            executable: invoice
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile executable
        # Bun 1.3.14's cross-compiled Windows bytecode executable crashes before
        # --help. Keep downloadable builds source-bundled on every platform.
        run: bun build --compile --minify --sourcemap --target=${{ matrix.target }} src/index.tsx --outfile dist/package/${{ matrix.executable }}
      - name: Test standalone executable outside checkout
        run: bun run scripts/smoke-binary.ts dist/package/${{ matrix.executable }}
      - name: Include license and local-use guide
        shell: bash
        run: |
          cp LICENSE dist/package/LICENSE
          cp docs/desktop.md dist/package/DESKTOP.md
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: tar -czf dist/pipa-${{ matrix.platform }}.tar.gz -C dist/package .
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath dist/pipa-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            dist/pipa-*.tar.gz
            dist/pipa-*.zip
          if-no-files-found: error
          retention-days: 7
