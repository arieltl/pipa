name: Binary downloads

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binary:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            executable: invoice
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            executable: invoice
          - platform: windows-x64
            # Bun 1.3.14 fails to extract its baseline target when compiling on
            # Windows. Cross-compile on Linux, then execute it on Windows below.
            runner: ubuntu-24.04
            target: bun-windows-x64-baseline
            executable: invoice.exe
          - platform: macos-x64
            runner: macos-15-intel
            target: bun-darwin-x64
            executable: invoice
          - platform: macos-arm64
            runner: macos-15
            target: bun-darwin-arm64
            executable: invoice
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile executable
        # Bun 1.3.14's cross-compiled Windows bytecode executable crashes before
        # --help. Keep downloadable builds source-bundled on every platform.
        run: bun build --compile --minify --sourcemap --target=${{ matrix.target }} src/index.tsx --outfile dist/package/${{ matrix.executable }}
      - name: Test standalone executable outside checkout
        if: matrix.platform != 'windows-x64'
        run: bun run scripts/smoke-binary.ts dist/package/${{ matrix.executable }}
      - name: Include license and local-use guide
        shell: bash
        run: |
          cp LICENSE dist/package/LICENSE
          cp docs/desktop.md dist/package/DESKTOP.md
      - name: Package Unix executable
        if: matrix.platform != 'windows-x64'
        run: tar -czf dist/pipa-${{ matrix.platform }}.tar.gz -C dist/package .
      - name: Package Windows executable
        if: matrix.platform == 'windows-x64'
        working-directory: dist/package
        run: zip ../pipa-windows-x64.zip invoice.exe LICENSE DESKTOP.md
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            dist/pipa-*.tar.gz
            dist/pipa-*.zip
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows packaged executable smoke
    needs: binary
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: binary-windows-x64
          path: downloads
      - name: Extract release archive
        shell: pwsh
        run: Expand-Archive downloads/pipa-windows-x64.zip -DestinationPath downloads/windows
      - name: Test Windows executable outside checkout
        run: bun run scripts/smoke-binary.ts downloads/windows/invoice.exe
